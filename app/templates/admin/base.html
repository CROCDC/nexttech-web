<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}Admin{% endblock %} · Next Tech</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='assets/favicon.ico') }}" type="image/x-icon">
    <style>
        :root {
            --bg: #070B16; --panel: #0e1426; --panel-2: #131b30;
            --border: #1f2a44; --text: #e8edf7; --soft: #93a0bd;
            --accent: #5b8cff; --accent-2: #7c5cff; --danger: #ff5c7a; --ok: #2ecc8f;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
        a { color: var(--accent); text-decoration: none; }
        .layout { display: flex; min-height: 100vh; }
        .sidebar { width: 230px; background: var(--panel); border-right: 1px solid var(--border);
            padding: 1.4rem 1rem; flex-shrink: 0; }
        .brand { display: flex; align-items: center; gap: .6rem; font-weight: 700;
            font-size: 1.05rem; margin-bottom: 1.6rem; color: #fff; }
        .brand img { width: 28px; height: 28px; }
        .nav a { display: block; padding: .6rem .75rem; border-radius: 9px; color: var(--soft);
            margin-bottom: .25rem; font-weight: 500; }
        .nav a:hover { background: var(--panel-2); color: var(--text); }
        .nav a.active { background: linear-gradient(90deg, rgba(91,140,255,.18), rgba(124,92,255,.12));
            color: #fff; }
        .content { flex: 1; padding: 2rem clamp(1rem, 4vw, 2.5rem); max-width: 1100px; }
        h1 { font-size: 1.5rem; margin: 0 0 1.4rem; }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            margin-bottom: 1.4rem; flex-wrap: wrap; }
        .btn { display: inline-flex; align-items: center; gap: .4rem; cursor: pointer;
            border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
            padding: .55rem .95rem; border-radius: 9px; font-size: .9rem; font-weight: 600;
            font-family: inherit; }
        .btn:hover { border-color: var(--accent); }
        .btn-primary { background: linear-gradient(90deg, var(--accent), var(--accent-2));
            border: none; color: #fff; }
        .btn-danger { background: transparent; border-color: rgba(255,92,122,.4); color: var(--danger); }
        .btn-danger:hover { background: rgba(255,92,122,.12); border-color: var(--danger); }
        .btn-sm { padding: .35rem .6rem; font-size: .82rem; }
        table { width: 100%; border-collapse: collapse; background: var(--panel);
            border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        th, td { text-align: left; padding: .75rem .9rem; border-bottom: 1px solid var(--border);
            font-size: .9rem; vertical-align: middle; }
        th { color: var(--soft); font-weight: 600; font-size: .78rem; text-transform: uppercase;
            letter-spacing: .04em; background: var(--panel-2); }
        tr:last-child td { border-bottom: none; }
        td.muted, .muted { color: var(--soft); }
        .actions { display: flex; gap: .4rem; justify-content: flex-end; }
        .drag-handle { cursor: grab; color: var(--soft); font-size: 1.1rem; text-align: center;
            width: 1.5rem; user-select: none; }
        .drag-handle:active { cursor: grabbing; }
        tr[draggable=true] { transition: background .15s; }
        tr.dragging { opacity: .45; background: var(--panel-2); }
        .tag { display: inline-block; padding: .15rem .5rem; border-radius: 999px; font-size: .72rem;
            font-weight: 600; background: var(--panel-2); border: 1px solid var(--border); color: var(--soft); }
        .tag.on { color: var(--ok); border-color: rgba(46,204,143,.4); }
        button.tag { font-family: inherit; cursor: pointer;
            transition: border-color .15s, color .15s; }
        button.tag:hover { border-color: var(--accent); color: var(--text); }
        button.tag.on:hover { border-color: var(--ok); color: var(--ok); }
        button.tag:disabled { opacity: .5; cursor: default; }
        .icon-thumb { width: 34px; height: 34px; object-fit: contain; border-radius: 8px;
            background: var(--panel-2); padding: 3px; }
        .icon-thumb.round { border-radius: 999px; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1rem; }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
            padding: 1.2rem; }
        .card .num { font-size: 2rem; font-weight: 700; }
        .card .lbl { color: var(--soft); font-size: .85rem; }
        form.stack { display: grid; gap: 1.1rem; max-width: 640px; }
        .field label { display: block; margin-bottom: .35rem; font-weight: 600; font-size: .88rem; }
        .field input[type=text], .field input[type=url], .field input[type=number],
        .field textarea, .field select {
            width: 100%; background: var(--panel); border: 1px solid var(--border); color: var(--text);
            border-radius: 9px; padding: .6rem .75rem; font-size: .92rem; font-family: inherit; }
        .field textarea { min-height: 90px; resize: vertical; }
        .field .hint { color: var(--soft); font-size: .78rem; margin-top: .3rem; }
        .check { display: flex; align-items: center; gap: .5rem; font-size: .9rem; }
        .check input { width: 18px; height: 18px; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem; }
        .form-actions { display: flex; gap: .6rem; margin-top: .4rem; }
        .flash { padding: .7rem 1rem; border-radius: 10px; margin-bottom: 1rem; font-size: .9rem;
            border: 1px solid var(--border); }
        .flash.success { background: rgba(46,204,143,.12); border-color: rgba(46,204,143,.4); color: var(--ok); }
        .flash.error { background: rgba(255,92,122,.12); border-color: rgba(255,92,122,.4); color: var(--danger); }
        .empty { color: var(--soft); padding: 2rem; text-align: center; background: var(--panel);
            border: 1px dashed var(--border); border-radius: 12px; }
        .inline { display: inline; }
        @media (max-width: 760px) {
            .layout { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
            .nav { display: flex; flex-wrap: wrap; gap: .3rem; }
            .nav a { margin: 0; }
            .row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand">
            <img src="{{ url_for('static', filename='assets/logo-mark-white.png') }}" alt="Next Tech">
            <span>Admin</span>
        </div>
        <nav class="nav">
            <a href="{{ url_for('admin.dashboard') }}" class="{{ 'active' if active == 'dashboard' }}">Inicio</a>
            <a href="{{ url_for('admin.job_openings') }}" class="{{ 'active' if active == 'busquedas' }}">Búsquedas abiertas</a>
            <a href="{{ url_for('admin.projects') }}" class="{{ 'active' if active == 'proyectos' }}">Proyectos</a>
            <a href="{{ url_for('admin.contacts') }}" class="{{ 'active' if active == 'consultas' }}">Consultas</a>
            <a href="{{ url_for('admin.applications') }}" class="{{ 'active' if active == 'postulaciones' }}">Postulaciones (CVs)</a>
            <a href="/" target="_blank" rel="noopener">Ver sitio ↗</a>
        </nav>
    </aside>
    <main class="content">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
